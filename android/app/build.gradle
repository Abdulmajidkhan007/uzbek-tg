apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Release imzo kaliti repoda yo'q (android/keystore.properties gitignore'da).
// Yo'q bo'lsa release build debug kalit bilan imzolanadi — telefonga o'rnatish
// uchun yetarli, Play Store uchun emas.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

react {
    /* Autolinking */
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Oldindan hisoblanadi: Groovy `versionCode (x).toInteger()` ni
// `versionCode(x).toInteger()` deb o'qib, versionCode'ga String beradi.
def appVersionCode = (System.getenv('APP_VERSION_CODE') ?: '1').toInteger()

// Telegram api_id / api_hash (my.telegram.org). Repoda YO'Q: CI'da GitHub
// secret'lardan (TG_API_ID, TG_API_HASH) env orqali, lokal build'da
// `-PTG_API_ID=... -PTG_API_HASH=...` bilan beriladi. Berilmasa ilova ochiladi,
// lekin Telegram'ga ulanmaydi va buni ekranda aytadi.
def tgApiId = ((findProperty('TG_API_ID') ?: System.getenv('TG_API_ID')) ?: '0').toString().trim()
def tgApiHash = ((findProperty('TG_API_HASH') ?: System.getenv('TG_API_HASH')) ?: '').toString().trim()
if (!(tgApiId ==~ /\d+/)) {
    throw new GradleException("TG_API_ID faqat raqam bo'lishi kerak")
}
if (!(tgApiHash ==~ /[0-9a-fA-F]*/)) {
    throw new GradleException("TG_API_HASH faqat hex belgilar bo'lishi kerak")
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "org.uzbektg.app"
    defaultConfig {
        applicationId "org.uzbektg.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI (apk-release.yml) run raqamini beradi: har yangi APK eskisining
        // ustiga yangilanish sifatida o'rnatiladi.
        versionCode appVersionCode
        versionName "0.1.${appVersionCode}"
        buildConfigField "int", "TG_API_ID", tgApiId
        buildConfigField "String", "TG_API_HASH", "\"${tgApiHash}\""
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

// Ekranlar faqat Ionicons ishlatadi — APK'ga shu shrift qo'shiladi.
project.ext.vectoricons = [ iconFontNames: [ 'Ionicons.ttf' ] ]
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

dependencies {
    // react-native versiyasini React Native Gradle Plugin belgilaydi
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
