# Android APK → GitHub Release, telefondan o'rnatish uchun:
#   https://github.com/Abdulmajidkhan007/uzbek-tg/releases/latest/download/uzbek-tg.apk
#
# Telegram: TG_API_ID / TG_API_HASH repository secret'laridan BuildConfig'ga
# beriladi (repoga, logga yozilmaydi). Berilmasa APK yig'iladi, lekin ilova
# "kalit yo'q" ekranini ko'rsatadi.
# TDLib (libtdjsonjava.so) "TDLib Android" workflow'i yig'gan release'dan olinadi;
# u hali tayyor bo'lmasa bu run APK chiqarmaydi va TDLib tugagach o'zi qayta ishlaydi.
#
# Imzo: android/keystore.properties repoda yo'q, shuning uchun release build
# debug kalit bilan imzolanadi — telefonga o'rnatish uchun yetarli, Play
# Store uchun EMAS.
name: APK Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['TDLib Android']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'assets/**'
      - 'App.tsx'
      - 'index.js'
      - 'package.json'
      - 'package-lock.json'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'scripts/fetch-tdlib.sh'
      - '.github/workflows/apk-release.yml'

permissions:
  contents: write

concurrency:
  group: apk-release
  cancel-in-progress: true

jobs:
  apk:
    # workflow_run: faqat TDLib muvaffaqiyatli yig'ilgan bo'lsa.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: TDLib (release'dan)
        id: tdlib
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if scripts/fetch-tdlib.sh; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::TDLib release hali yo'q — 'TDLib Android' workflow'i tugagach APK avtomatik yig'iladi."
          fi

      - uses: actions/setup-node@v4
        if: steps.tdlib.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.tdlib.outputs.ok == 'true'

      - name: Typecheck
        if: steps.tdlib.outputs.ok == 'true'
        run: npx tsc --noEmit

      - uses: actions/setup-java@v4
        if: steps.tdlib.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Release imzo kaliti
        if: steps.tdlib.outputs.ok == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD yo'q — APK debug kalit bilan imzolanadi (tarqatish uchun emas)."
            exit 0
          fi
          umask 077
          printf '%s' "$KS_B64" | base64 -d > android/release.jks
          # Parol noto'g'ri bo'lsa shu yerning o'zida aniq xato bilan to'xtash.
          if ! keytool -list -keystore android/release.jks -storepass "$KS_PASS" -alias uzbektg > /dev/null 2>&1; then
            echo "::error::Release kalitini ochib bo'lmadi: ANDROID_KEYSTORE_BASE64 yoki ANDROID_KEYSTORE_PASSWORD noto'g'ri."
            exit 1
          fi
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=uzbektg\nkeyPassword=%s\n' "$KS_PASS" "$KS_PASS" > android/keystore.properties
          echo "SIGNING=release" >> "$GITHUB_ENV"

      - name: Build release APK
        if: steps.tdlib.outputs.ok == 'true'
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::warning::TG_API_ID / TG_API_HASH secret'lari yo'q — APK Telegram'ga ulanmaydi."
          fi
          # Xato bo'lsa "What went wrong" bloki annotation bo'ladi — run
          # sahifasidan (telefondan ham) log yuklamasdan o'qiladi.
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            msg=$(grep -A30 'What went wrong' "$RUNNER_TEMP/gradle.log" | head -45)
            [ -n "$msg" ] || msg=$(tail -45 "$RUNNER_TEMP/gradle.log")
            msg=${msg//'%'/'%25'}; msg=${msg//$'\r'/}; msg=${msg//$'\n'/'%0A'}
            echo "::error title=Gradle build failed::$msg"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/uzbek-tg.apk"

      - name: Publish GitHub Release
        if: steps.tdlib.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${GITHUB_SHA::7}"
          TAG="apk-${{ github.run_number }}"
          # Katta fayl yuklash GitHub tomonida ba'zan uziladi — qayta urinish,
          # xato annotation sifatida chiqadi.
          for attempt in 1 2 3; do
            if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release create "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "Uzbek TG APK #${{ github.run_number }} ($SHA)" \
                --notes "Android APK, commit $SHA. Telegram (TDLib). Imzo: ${SIGNING:-debug}." \
                --latest 2> "$RUNNER_TEMP/gh.err" || true
            fi
            if gh release upload "$TAG" "$RUNNER_TEMP/uzbek-tg.apk" --clobber --repo "$GITHUB_REPOSITORY" 2>> "$RUNNER_TEMP/gh.err"; then
              exit 0
            fi
            echo "Upload attempt $attempt failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          msg=$(tail -5 "$RUNNER_TEMP/gh.err" | tr '\n' ' ')
          echo "::error title=Release upload failed::$msg"
          exit 1

      - name: Kalitni o'chirish
        if: always()
        run: rm -f android/release.jks android/keystore.properties
