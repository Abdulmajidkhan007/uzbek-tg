# Release imzo kalitini (keystore) BIR MARTA yaratadi — telefondan keytool
# ishlatmaslik uchun. Natija: 1 kun saqlanadigan artifact (faqat repo egasi
# yuklay oladi) — ichida:
#   uzbek-tg-release.jks    — kalit fayli (ZAXIRA QILING: yo'qolsa ilovani
#                             yangilab bo'lmaydi)
#   ANDROID_KEYSTORE_BASE64.txt   → shu nomli secret'ga
#   ANDROID_KEYSTORE_PASSWORD.txt → shu nomli secret'ga
# Parol tasodifiy yaratiladi va logga chiqmaydi.
#
# DIQQAT: qayta ishga tushirish YANGI kalit yaratadi. Secret'lar allaqachon
# qo'yilgan bo'lsa, buni qilmang — eski kalit bilan imzolangan ilova yangisi
# ustiga o'rnatilmaydi.
name: Release keystore yaratish

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Yangi kalit yaratilsinmi? 'HA' deb yozing"
        required: true

permissions:
  contents: read

jobs:
  keystore:
    if: ${{ inputs.confirm == 'HA' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Kalit yaratish
        run: |
          set -euo pipefail
          umask 077
          OUT="$RUNNER_TEMP/uzbek-tg-keystore"
          mkdir -p "$OUT"
          PW=$(openssl rand -base64 30 | tr -dc 'A-Za-z0-9' | head -c 32)
          echo "::add-mask::$PW"
          keytool -genkeypair -noprompt \
            -keystore "$OUT/uzbek-tg-release.jks" -storetype PKCS12 \
            -alias uzbektg -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=Uzbek TG, O=uzbektg, C=UZ" > /dev/null 2>&1
          base64 -w0 "$OUT/uzbek-tg-release.jks" > "$OUT/ANDROID_KEYSTORE_BASE64.txt"
          printf '%s' "$PW" > "$OUT/ANDROID_KEYSTORE_PASSWORD.txt"
          SHA=$(keytool -list -v -keystore "$OUT/uzbek-tg-release.jks" -storepass "$PW" -alias uzbektg | awk '/SHA256:/ {print $2; exit}')
          printf 'alias: uzbektg\nSHA-256: %s\n' "$SHA" > "$OUT/README.txt"
          echo "Kalit yaratildi. SHA-256: $SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: uzbek-tg-keystore
          path: ${{ runner.temp }}/uzbek-tg-keystore/
          retention-days: 1
